name: 안드로이드 설치 파일 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 설치 파일 만들기
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk taxi.apk
      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 택시 미터기 ${{ github.run_number }}
          files: taxi.apk
      - name: 설치 사이트에 복사
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1
          git worktree add pages FETCH_HEAD
          cp taxi.apk pages/taxi.apk
          cp app/src/main/assets/index.html pages/index.html
          cd pages
          git add taxi.apk index.html
          git commit -m "안드로이드 설치 파일 갱신 (${{ github.run_number }})" || exit 0
          git push origin HEAD:gh-pages

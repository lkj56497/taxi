<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>택시 미터기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="택시 미터기">
<meta name="theme-color" content="#15171b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --lcd-blue:#9fd3ff; --lcd-green:#52ff86; --lcd-pink:#ff6aa6; --lcd-yellow:#ffe24d; --lcd-dim:#5f6b78;
  --key:#2a2d33; --key-hi:#3a3e46; --key-ink:#e9ecf1;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#121418;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;left:0;top:0;width:var(--W,100vw);height:var(--H,100vh);transform-origin:0 0;--u:calc(var(--H,100vh)/100);
  background:radial-gradient(120% 90% at 30% 10%,#2a2e35 0%,#17191d 55%,#0e0f12 100%)}
#app.rot{transform:translateX(var(--VW)) rotate(90deg)}
.meter{position:absolute;top:calc(var(--u)*3);bottom:calc(var(--u)*3);left:calc(var(--u)*3 + var(--sl,0px));right:calc(var(--u)*3 + var(--sr,0px));
  display:flex;gap:calc(var(--u)*2.4)}

/* ── 왼쪽: 표시창 + 기능 버튼 ── */
.left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*2.2);
  background:linear-gradient(#202328,#121417);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.2);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgb(0 0 0/.6),inset 0 1px 0 rgb(255 255 255/.06)}
.lcd{flex:1 1 auto;min-height:0;position:relative;border-radius:calc(var(--u)*1.8);overflow:hidden;
  background:radial-gradient(70% 60% at 62% 78%,rgb(150 140 15/.42),transparent 70%),radial-gradient(60% 70% at 15% 30%,rgb(20 40 90/.5),transparent 70%),linear-gradient(#07090c,#101318);
  border:calc(var(--u)*.9) solid #050607;box-shadow:inset 0 0 calc(var(--u)*4) rgb(0 0 0/.9);
  display:grid;grid-template-columns:calc(var(--u)*25) 1fr;grid-template-rows:calc(var(--u)*9) 1fr calc(var(--u)*8.5);
  padding:calc(var(--u)*1.6) calc(var(--u)*2.4);column-gap:calc(var(--u)*1.5)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgb(255 255 255/.07) 0%,transparent 35%),repeating-linear-gradient(0deg,rgb(255 255 255/.018) 0 1px,transparent 1px 3px)}
.glow{text-shadow:0 0 calc(var(--u)*1.2) currentColor}
.top{grid-column:1/3;display:flex;align-items:center;gap:calc(var(--u)*2.4);font-weight:800;white-space:nowrap;min-width:0}
.brand{color:var(--lcd-yellow);font-size:calc(var(--u)*4.2);letter-spacing:.04em}
.cnt{color:var(--lcd-blue);font-size:calc(var(--u)*5.6);font-variant-numeric:tabular-nums}
.spd{color:var(--lcd-green);font-size:calc(var(--u)*5.2);font-variant-numeric:tabular-nums}
.spd small{font-size:.62em;margin-left:.15em}
.gps{display:flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*3.2);color:var(--lcd-dim);font-weight:700}
.gps i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;background:#ff4b4b;box-shadow:0 0 calc(var(--u)*1) currentColor;color:#ff4b4b}
.gps.ok i{background:var(--lcd-green);color:var(--lcd-green)}
.gps.wait i{background:var(--lcd-yellow);color:var(--lcd-yellow)}
.clock{color:#cfd6df;font-size:calc(var(--u)*4.6);font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*.3);min-width:0}
.horse{width:calc(var(--u)*19);height:calc(var(--u)*23);opacity:.4;transition:opacity .3s}
.horse.on{opacity:1}
.rate{color:var(--lcd-blue);font-size:calc(var(--u)*8);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.remain{color:var(--lcd-pink);font-size:calc(var(--u)*10.5);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.remain small{display:block;font-size:calc(var(--u)*2.8);color:#ff9cc4;letter-spacing:0;margin-top:calc(var(--u)*.6);font-weight:700}
.main{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:0;min-height:0;overflow:hidden}
.fareRow{display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.fare{color:var(--lcd-blue);font-size:calc(var(--u)*29);font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  transform:skewX(-4deg);text-shadow:0 0 calc(var(--u)*2) rgb(140 200 255/.7)}
.fare.dim{opacity:.45}
.fare.len5{font-size:calc(var(--u)*24)}.fare.len6{font-size:calc(var(--u)*20)}.fare.len7{font-size:calc(var(--u)*17)}
.unit{display:flex;flex-direction:column;align-items:center;color:#e8f0ff;font-weight:800;line-height:1}
.unit b{font-size:calc(var(--u)*6.4)}
.unit span{font-size:calc(var(--u)*2.6);color:var(--lcd-dim);margin-top:calc(var(--u)*.6)}
.callRow{display:flex;align-items:center;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*.8);min-height:calc(var(--u)*9)}
.call{color:var(--lcd-yellow);font-size:calc(var(--u)*9);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.callRow .unit b{font-size:calc(var(--u)*3.4);color:var(--lcd-yellow)}
.sub{color:#c6cfda;font-size:calc(var(--u)*3.3);max-width:100%;overflow:hidden;text-overflow:ellipsis;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:calc(var(--u)*1);margin-top:calc(var(--u)*1);flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:calc(var(--u)*3);font-weight:800;border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.3) calc(var(--u)*1.4);border:1px solid currentColor}
.chip.n{color:var(--lcd-pink)}.chip.o{color:#7cf0ff}.chip.d{color:var(--lcd-green)}.chip.x{color:var(--lcd-yellow)}.chip.p{color:#ffa94d}
.payBtns{display:flex;gap:calc(var(--u)*1.4);margin-top:calc(var(--u)*1.2)}
.payBtns button{font-size:calc(var(--u)*3.6);font-weight:800;padding:calc(var(--u)*1) calc(var(--u)*2.6);border-radius:calc(var(--u)*1.2);border:1px solid #6b7684;color:#dfe6ee;background:rgb(255 255 255/.05)}
.payBtns button.on{background:var(--lcd-green);color:#06210f;border-color:var(--lcd-green)}
.bottom{grid-column:1/3;display:flex;align-items:center;gap:calc(var(--u)*1.6);min-width:0;position:relative;z-index:1}
.status{background:#2f4fff;color:#fff;font-weight:900;font-size:calc(var(--u)*4);padding:calc(var(--u)*.6) calc(var(--u)*1.8);border-radius:calc(var(--u)*.8);
  box-shadow:0 0 calc(var(--u)*1.6) rgb(60 90 255/.8);white-space:nowrap}
.status.vac{background:#e8ebef;color:#111;box-shadow:0 0 calc(var(--u)*1.4) rgb(255 255 255/.5)}
.status.paid{background:#33c25a;box-shadow:0 0 calc(var(--u)*1.6) rgb(60 255 120/.6)}
.stats{display:flex;gap:calc(var(--u)*1.8);font-size:calc(var(--u)*2.9);color:#aeb8c4;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0;font-variant-numeric:tabular-nums}
.stats span.sel{color:#fff;background:rgb(255 255 255/.14);border-radius:calc(var(--u)*.6);padding:0 calc(var(--u)*.8)}
.serial{margin-left:auto;font-size:calc(var(--u)*2.6);overflow:hidden;color:var(--lcd-dim);white-space:nowrap}
.input{position:absolute;right:calc(var(--u)*2.4);top:calc(var(--u)*11);background:rgb(0 0 0/.75);border:1px solid var(--lcd-yellow);color:var(--lcd-yellow);
  font-size:calc(var(--u)*5);font-weight:800;padding:calc(var(--u)*.6) calc(var(--u)*1.8);border-radius:calc(var(--u)*1);z-index:2;font-variant-numeric:tabular-nums}
.input small{font-size:.55em;color:#d9c96a;margin-right:.6em}
.practice{position:absolute;left:calc(var(--u)*14);right:calc(var(--u)*2.4);bottom:calc(var(--u)*1.4);z-index:2;display:flex;align-items:center;gap:calc(var(--u)*1.6);
  background:#2a1a00;border:1px solid #ffa94d;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*1.8);color:#ffd29a;font-weight:800;font-size:calc(var(--u)*3.2)}
.practice input{flex:1;accent-color:#ffa94d;height:calc(var(--u)*5)}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgb(0 0 0/.85);border:1px solid #7f8a96;color:#fff;font-weight:800;
  font-size:calc(var(--u)*4);padding:calc(var(--u)*1.6) calc(var(--u)*3);border-radius:calc(var(--u)*1.6);z-index:5;white-space:nowrap;pointer-events:none}

.fkeys{flex:0 0 calc(var(--u)*15);display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*1.2)}
.fk{position:relative;border-radius:calc(var(--u)*1.4);font-size:calc(var(--u)*6.4);font-weight:900;color:#1a1a22;letter-spacing:.06em;
  box-shadow:0 calc(var(--u)*.8) 0 rgb(0 0 0/.55),inset 0 calc(var(--u)*-.6) 0 rgb(0 0 0/.15);transition:transform .06s}
.fk:active,.k:active{transform:translateY(calc(var(--u)*.6))}
.fk[data-k=vac]{background:linear-gradient(#ffffff,#dfe3ea)}
.fk[data-k=hire]{background:linear-gradient(#d9d7ff,#a9a6f4)}
.fk[data-k=night]{background:linear-gradient(#ff9cc9,#f0649f)}
.fk[data-k=combo]{background:linear-gradient(#fff07a,#f3cf1f)}
.fk[data-k=pay]{background:linear-gradient(#b8ff8c,#6fdc4a)}
.fk::after{content:"";position:absolute;top:calc(var(--u)*1.2);right:calc(var(--u)*1.2);width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:rgb(0 0 0/.25)}
.fk.on::after{background:#ff2a2a;box-shadow:0 0 calc(var(--u)*1.4) #ff2a2a}

/* ── 오른쪽: 숫자판 ── */
.pad{flex:0 0 min(40%,calc(var(--u)*92));display:flex;flex-direction:column;gap:calc(var(--u)*1.6);
  background:linear-gradient(#1f2226,#0f1012);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.2) calc(var(--u)*2.4);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgb(0 0 0/.6),inset 0 1px 0 rgb(255 255 255/.06)}
.padTop{display:flex;align-items:center;gap:calc(var(--u)*1.6);height:calc(var(--u)*9)}
.maker{font-size:calc(var(--u)*3);color:#c9cdd3;font-weight:800;letter-spacing:.04em;line-height:1.2}
.maker small{display:block;font-size:calc(var(--u)*2.2);color:#7d848d;font-weight:600}
.seal{margin-left:auto;background:linear-gradient(#ff8fb8,#f25d93);color:#5a0b2a;font-weight:900;font-size:calc(var(--u)*2.5);padding:calc(var(--u)*.8) calc(var(--u)*1.4);
  border-radius:calc(var(--u)*.6);transform:rotate(-3deg);line-height:1.15;text-align:center}
.keys{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:calc(var(--u)*1.4)}
.k{border-radius:calc(var(--u)*1.2);background:linear-gradient(var(--key-hi),var(--key));color:var(--key-ink);font-weight:800;font-size:calc(var(--u)*4.4);
  box-shadow:0 calc(var(--u)*.7) 0 #000,inset 0 1px 0 rgb(255 255 255/.12);transition:transform .06s;display:flex;align-items:center;justify-content:center;line-height:1}
.k.n{font-size:calc(var(--u)*6);background:linear-gradient(#34383f,#22252a);font-variant-numeric:tabular-nums}
.k.f{font-size:calc(var(--u)*4)}
.k.on{color:#111;background:linear-gradient(#ffe46b,#e8c21c)}
.k.lab{font-size:calc(var(--u)*3.4);color:#aab2bc}

/* ── 창 ── */
.sheet{position:absolute;inset:0;z-index:20;background:rgb(0 0 0/.6);display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*3)}
.card{background:#1d2026;border:1px solid #3a3f48;border-radius:calc(var(--u)*3);width:min(100%,calc(var(--u)*190));max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgb(0 0 0/.6)}
.cardHead{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2.4) calc(var(--u)*3);border-bottom:1px solid #31353d}
.cardHead h2{font-size:calc(var(--u)*5);font-weight:900}
.cardHead .sp{flex:1}
.btn{font-weight:800;font-size:calc(var(--u)*3.8);padding:calc(var(--u)*1.4) calc(var(--u)*3);border-radius:calc(var(--u)*1.4);background:#323741;color:#fff}
.btn.pri{background:#ffd43b;color:#1f1800}
.btn.red{background:#5a2328;color:#ffd4d6}
.cardBody{overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--u)*2.4) calc(var(--u)*3) calc(var(--u)*3);-webkit-user-select:text;user-select:text}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6) calc(var(--u)*4)}
.sec{grid-column:1/3;font-size:calc(var(--u)*3.4);font-weight:900;color:#ffd43b;margin-top:calc(var(--u)*1.6);padding-bottom:calc(var(--u)*.6);border-bottom:1px solid #31353d}
.fld{display:flex;align-items:center;gap:calc(var(--u)*1.6);font-size:calc(var(--u)*3.6);color:#d6dbe2}
.fld span{flex:1}
.fld input[type=number],.fld input[type=text]{width:calc(var(--u)*30);font:inherit;font-weight:700;color:#fff;background:#111317;border:1px solid #3a3f48;border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.4);text-align:right}
.fld input[type=text]{text-align:left}
.fld input[type=checkbox]{width:calc(var(--u)*5);height:calc(var(--u)*5);accent-color:#ffd43b}
.fld .u{width:auto;flex:none;color:#8e97a3;font-size:.85em}
.nightRow{white-space:nowrap;display:flex;align-items:center;gap:calc(var(--u)*1);font-size:calc(var(--u)*3.4);color:#d6dbe2}
.nightRow input{width:calc(var(--u)*13);font:inherit;font-weight:700;color:#fff;background:#111317;border:1px solid #3a3f48;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8);text-align:center}
.seg{display:flex;gap:calc(var(--u)*1)}
.seg button{font-weight:800;font-size:calc(var(--u)*3.6);padding:calc(var(--u)*1.2) calc(var(--u)*2.6);border-radius:calc(var(--u)*1.2);background:#2a2e35;color:#cfd5dc}
.seg button.on{background:#ffd43b;color:#1f1800}
.help{grid-column:1/3;font-size:calc(var(--u)*3);color:#8e97a3;line-height:1.5}
table.hist{width:100%;border-collapse:collapse;font-size:calc(var(--u)*3.4);font-variant-numeric:tabular-nums}
table.hist th{color:#8e97a3;font-weight:700;text-align:left;padding:calc(var(--u)*1) calc(var(--u)*1);border-bottom:1px solid #31353d;position:sticky;top:calc(var(--u)*-2.4);background:#1d2026}
table.hist td{padding:calc(var(--u)*1.2) calc(var(--u)*1);border-bottom:1px solid #2a2e35}
table.hist tr{cursor:pointer}
table.hist td.r,table.hist th.r{text-align:right}
.sumbar{display:flex;gap:calc(var(--u)*4);flex-wrap:wrap;font-size:calc(var(--u)*3.6);font-weight:800;margin-bottom:calc(var(--u)*2)}
.sumbar b{color:#ffd43b}
.empty{color:#8e97a3;text-align:center;padding:calc(var(--u)*6);font-size:calc(var(--u)*3.8)}
.receipt{background:#fbfaf5;color:#111;font-family:ui-monospace,"D2Coding","Noto Sans Mono CJK KR",Menlo,monospace;font-size:calc(var(--u)*3.4);line-height:1.55;
  width:min(100%,calc(var(--u)*96));margin:0 auto;padding:calc(var(--u)*3) calc(var(--u)*3.4);border-radius:calc(var(--u)*.6);box-shadow:0 0 0 1px #ddd}
.receipt h3{text-align:center;font-size:calc(var(--u)*4.6);margin-bottom:calc(var(--u)*1)}
.receipt .ln{display:flex;justify-content:space-between;gap:1em}
.receipt hr{border:0;border-top:1px dashed #888;margin:calc(var(--u)*1.2) 0}
.receipt .tot{font-size:calc(var(--u)*4.6);font-weight:900}
.receipt .c{text-align:center;color:#555;font-size:.9em}
.receiptWrap{display:flex;gap:calc(var(--u)*3);align-items:flex-start}
.receiptSide{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);min-width:calc(var(--u)*34)}
.confirm .cardBody{font-size:calc(var(--u)*4);line-height:1.5}
.confirm .acts{display:flex;gap:calc(var(--u)*2);justify-content:flex-end;padding:0 calc(var(--u)*3) calc(var(--u)*3)}
</style>
</head>
<body>
<div id="app">
  <div class="meter">
    <section class="left">
      <div class="lcd" id="lcd">
        <div class="top">
          <span class="brand glow">택시미터</span>
          <span class="cnt glow" id="cnt">0</span>
          <span class="spd glow" id="spd">시속 0.0<small>㎞</small></span>
          <span class="gps wait" id="gps"><i></i><b id="gpsTxt">위치 찾는 중</b></span>
          <span class="serial" id="serial"></span><span class="clock" id="clock">00:00</span>
        </div>
        <div class="side">
          <canvas class="horse" id="horse" aria-hidden="true"></canvas>
          <div class="rate glow" id="rate">0%</div>
          <div class="remain glow" id="remain">0<small id="remainLbl">다음 요금까지 (m)</small></div>
        </div>
        <div class="main">
          <div class="fareRow"><div class="fare" id="fare">4800</div><div class="unit"><b>원</b><span id="fareLbl">기본</span></div></div>
          <div class="callRow"><div class="call glow" id="call">0</div><div class="unit"><b>호출</b><b>요금</b></div></div>
          <div class="sub" id="sub"></div>
          <div class="chips" id="chips"></div>
          <div class="payBtns" id="payBtns" hidden><button data-pay="현금">현금</button><button data-pay="카드">카드</button><button data-pay="계좌이체">계좌이체</button></div>
        </div>
        <div class="bottom">
          <span class="status vac" id="status">빈차</span>
          <div class="stats" id="stats"></div>
        </div>
        <div class="input" id="input" hidden></div>
        <div class="practice" id="practice" hidden><span>연습 주행</span><input type="range" id="pSpd" min="0" max="100" step="1" value="0"><span id="pSpdTxt">시속 0㎞</span></div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="fkeys">
        <button class="fk" data-k="vac">빈차</button>
        <button class="fk" data-k="hire">주행</button>
        <button class="fk" data-k="night">할증</button>
        <button class="fk" data-k="combo">복합</button>
        <button class="fk" data-k="pay">지불</button>
      </div>
    </section>
    <section class="pad">
      <div class="padTop">
        <div class="maker">전자식 택시 미터기<small>휴대폰용</small></div>
        <div class="seal">검정필<br>2026</div>
      </div>
      <div class="keys">
        <button class="k f" data-k="mode">구분</button><button class="k f" data-k="cargo">화물</button>
        <button class="k n" data-n="1">1</button><button class="k n" data-n="2">2</button><button class="k n" data-n="3">3</button>
        <button class="k f" data-k="out">시외</button><button class="k f" data-k="callk">호출</button>
        <button class="k n" data-n="4">4</button><button class="k n" data-n="5">5</button><button class="k n" data-n="6">6</button>
        <button class="k f" data-k="disc">인할</button><button class="k f" data-k="print">인쇄</button>
        <button class="k n" data-n="7">7</button><button class="k n" data-n="8">8</button><button class="k n" data-n="9">9</button>
        <button class="k f" data-k="hist">기록</button><button class="k f" data-k="prac">연습</button>
        <button class="k lab" data-k="set">설정</button><button class="k n" data-n="0">0</button><button class="k f" data-k="cancel">취소</button>
      </div>
    </section>
  </div>

  <!-- 설정 -->
  <div class="sheet" id="setSheet" hidden>
    <div class="card">
      <div class="cardHead"><h2>설정</h2><div class="sp"></div><button class="btn" data-close>닫기</button><button class="btn pri" id="setSave">저장</button></div>
      <div class="cardBody"><div class="grid2" id="setForm"></div></div>
    </div>
  </div>
  <!-- 기록 -->
  <div class="sheet" id="histSheet" hidden>
    <div class="card">
      <div class="cardHead"><h2>운행 기록</h2><div class="sp"></div><button class="btn red" id="histClear">기록 모두 지우기</button><button class="btn" data-close>닫기</button></div>
      <div class="cardBody" id="histBody"></div>
    </div>
  </div>
  <!-- 영수증 -->
  <div class="sheet" id="rcSheet" hidden>
    <div class="card">
      <div class="cardHead"><h2>영수증</h2><div class="sp"></div><button class="btn" data-close>닫기</button></div>
      <div class="cardBody"><div class="receiptWrap"><div class="receipt" id="receipt"></div>
        <div class="receiptSide"><button class="btn pri" id="rcShare">영수증 보내기</button><button class="btn" id="rcCopy">글자로 복사</button><p class="help" id="rcHelp">손님에게 문자나 카카오톡으로 영수증을 보낼 수 있어요.</p></div></div></div>
    </div>
  </div>
  <!-- 확인 -->
  <div class="sheet confirm" id="cfSheet" hidden>
    <div class="card" style="width:min(100%,calc(var(--u)*120))">
      <div class="cardHead"><h2 id="cfTitle">확인</h2></div>
      <div class="cardBody" id="cfMsg"></div>
      <div class="acts"><button class="btn" id="cfNo">아니요</button><button class="btn pri" id="cfYes">네</button></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const app=$("app");
const NATIVE=window.Android||null;
const KEY="taximeter.v1";

/* ───────── 화면 크기 · 가로 고정 ───────── */
function fit(){
  const vw=innerWidth, vh=innerHeight, rot=vh>vw;
  const W=rot?vh:vw, H=rot?vw:vh;
  app.style.setProperty("--W",W+"px");app.style.setProperty("--H",H+"px");app.style.setProperty("--VW",vw+"px");
  app.classList.toggle("rot",rot);
}
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,200));fit();
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}
(function safe(){const d=document.createElement("div");d.style.cssText="position:fixed;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);top:0;height:0;visibility:hidden";document.body.appendChild(d);
  const r=d.getBoundingClientRect();app.style.setProperty("--sl",Math.max(0,r.left-12)+"px");app.style.setProperty("--sr",Math.max(0,innerWidth-r.right-12)+"px");d.remove()})();

/* ───────── 요금 기준 ───────── */
const PRESETS={
  gyeonggi:{label:"경기도 (표준형)",base:4800,baseDist:1600,unitFare:100,unitDist:131,unitSec:30,thr:15.72,night:[[23,4,30],["","",""],["","",""]],out:20},
  seoul:{label:"서울",base:4800,baseDist:1600,unitFare:100,unitDist:131,unitSec:30,thr:15.72,night:[[22,23,20],[23,2,40],[2,4,20]],out:20}
};
const DEF=Object.assign({preset:"gyeonggi",nightAuto:true,manualNight:20,callFee:1000,cargoFee:1000,discRate:10,
  shop:"",carNo:"",bizNo:"",driver:"",phone:"",beep:true,voice:true},JSON.parse(JSON.stringify(PRESETS.gyeonggi)));
delete DEF.label;

let S;
function fresh(){return{set:JSON.parse(JSON.stringify(DEF)),mode:"vac",night:false,out:false,call:0,extras:[],disc:false,
  trip:null,stats:{total:0,biz:0,empty:0,count:0,sum:0},statSel:0,hist:[],serial:String(100000+Math.floor(Math.random()*899999)),lastT:Date.now(),lastWin:null,practice:false}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.set){S=fresh()}else{S.set=Object.assign(JSON.parse(JSON.stringify(DEF)),S.set);S.practice=false}
let dirty=true,lastSave=0;
function save(force){if(!force&&Date.now()-lastSave<3000)return;lastSave=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ───────── 계산 ───────── */
function nightWindowRate(d,cfg){
  const h=d.getHours()+d.getMinutes()/60;
  for(const w of (cfg||S.set).night){const a=+w[0],b=+w[1],r=+w[2];if(w[0]===""||w[1]===""||!r)continue;
    if(a<b?(h>=a&&h<b):(h>=a||h<b))return r}
  return null;
}
function curRate(){
  const cfg=S.trip?S.trip.cfg:S.set;let r=0;
  if(S.night){const w=nightWindowRate(new Date(),cfg);r+=(w==null?+S.set.manualNight:w)}
  if(S.out)r+=+cfg.out;
  return r;
}
const fl100=n=>Math.floor(n/100)*100;
const unitAmt=(cfg,r)=>Math.round(cfg.unitFare*(1+r/100)/10)*10;
function totals(){
  const T=S.trip;const fare=T?T.fare:fl100(S.set.base*(1+curRate()/100));
  const extra=S.extras.reduce((a,b)=>a+b,0);
  const disc=S.disc?fl100(fare*(+S.set.discRate)/100):0;
  return{fare,call:S.call,extra,disc,total:fare+S.call+extra-disc};
}
function startTrip(){
  const cfg=JSON.parse(JSON.stringify(S.set));
  S.trip={cfg,start:Date.now(),end:null,dist:0,secs:0,slowSecs:0,cnt:0,nextAt:+cfg.baseDist,fare:fl100(cfg.base*(1+curRate()/100)),startRate:curRate(),maxRate:curRate(),pay:"",histId:null};
  S.mode="hire";
}
function meter(eq){
  const T=S.trip,cfg=T.cfg;T.cnt+=eq;let n=0;
  while(T.cnt>=T.nextAt&&n<5000){const r=curRate();T.fare+=unitAmt(cfg,r);T.nextAt+= +cfg.unitDist;n++;if(r>T.maxRate)T.maxRate=r}
}
function advance(t,d,v){
  let dt=(t-S.lastT)/1000;S.lastT=t;
  if(!(dt>0))dt=0;if(dt>60)dt=0;
  S.stats.total+=d;
  if(S.mode==="hire"&&S.trip){
    const T=S.trip,cfg=T.cfg;T.dist+=d;T.secs+=dt;S.stats.biz+=d;
    let eq;if(v<+cfg.thr){eq=dt*cfg.unitDist/cfg.unitSec;T.slowSecs+=dt}else eq=d;
    meter(eq);
  }else if(S.mode==="vac")S.stats.empty+=d;
  dirty=true;
}

/* ───────── 위치 ───────── */
let lastFix=null,lastFixT=0,curSpeed=0,gpsState="wait",gpsMsg="위치 찾는 중";
function hav(a,b){const R=6371000,toR=Math.PI/180,dLa=(b.lat-a.lat)*toR,dLo=(b.lng-a.lng)*toR;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function onFix(f){
  if(S.practice)return;
  if(!(f.acc<=60)){gpsState="wait";gpsMsg="신호 약함";return}
  gpsState="ok";gpsMsg="위치 정상";
  if(!lastFix){lastFix=f;lastFixT=f.t;advance(f.t,0,curSpeed);return}
  const dt=(f.t-lastFix.t)/1000;if(dt<=0)return;
  let d=hav(lastFix,f);
  const vCalc=d/dt*3.6;
  if(vCalc>220&&dt<15){lastFix=Object.assign({},lastFix,{t:f.t});return}
  let v=(f.spd!=null&&f.spd>=0)?f.spd*3.6:vCalc;
  if(v<3&&d<12)d=0;
  curSpeed=d===0&&v<3?0:v;lastFixT=f.t;
  advance(f.t,d,curSpeed);
  lastFix=d>0?f:Object.assign({},lastFix,{t:f.t});
}
function startGps(){
  if(NATIVE)return;
  if(!navigator.geolocation){gpsState="bad";gpsMsg="위치 사용 불가";return}
  navigator.geolocation.watchPosition(p=>onFix({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,spd:p.coords.speed,t:Date.now()}),
    e=>{gpsState="bad";gpsMsg=e.code===1?"위치 권한 꺼짐":"위치 신호 없음"},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function drainNative(){
  if(!NATIVE||!NATIVE.drain)return;
  let arr;try{arr=JSON.parse(NATIVE.drain()||"[]")}catch(e){return}
  for(const a of arr)onFix({lat:a[0],lng:a[1],acc:a[2],spd:a[3],t:a[4]});
  if(NATIVE.gpsStatus){const s=NATIVE.gpsStatus();if(s==="denied"){gpsState="bad";gpsMsg="위치 권한 꺼짐"}else if(s==="off"){gpsState="bad";gpsMsg="위치(지피에스) 꺼짐"}else if(s==="wait"&&!lastFixT){gpsState="wait";gpsMsg="위치 찾는 중"}}
}

/* ───────── 소리 ───────── */
let ac=null;
function beep(f){if(!S.set.beep)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f||2200;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}catch(e){}}
function say(t){if(!S.set.voice)return;try{if(NATIVE&&NATIVE.speak){NATIVE.speak(t);return}
  if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1.05;speechSynthesis.speak(u)}}catch(e){}}
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const km=m=>(m/1000).toFixed(m<10000?2:1)+"㎞";
function dur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${x}초`:`${x}초`}
function fmtTime(t){const d=new Date(t);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ───────── 화면 그리기 ───────── */
let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
let input="";
function render(){
  const now=new Date(),p=n=>String(n).padStart(2,"0");
  $("clock").textContent=p(now.getHours())+":"+p(now.getMinutes());
  $("cnt").textContent=S.stats.count;
  const v=S.practice?+$("pSpd").value:curSpeed;
  $("spd").firstChild.nodeValue="시속 "+v.toFixed(1);
  const g=$("gps");g.className="gps "+(S.practice?"ok":gpsState);$("gpsTxt").textContent=S.practice?"연습 주행":gpsMsg;
  const r=curRate();$("rate").textContent=r+"%";
  const T=S.trip,tt=totals();
  const fare=$("fare"),st=$("status");
  let big,lbl;
  if(S.mode==="paid"){big=tt.total;lbl="합계";st.textContent="지불";st.className="status paid"}
  else if(S.mode==="hire"){big=tt.fare;lbl="요금";st.textContent=S.night&&S.out?"복합":S.night?"할증":S.out?"시외":"주행";st.className="status"}
  else{big=tt.fare;lbl="기본";st.textContent="빈차";st.className="status vac"}
  const s=String(big);fare.textContent=s;fare.className="fare"+(S.mode==="vac"?" dim":"")+(s.length>=7?" len7":s.length===6?" len6":s.length===5?" len5":"");
  $("fareLbl").textContent=lbl;
  $("call").textContent=S.call;document.querySelector(".callRow").hidden=S.mode==="paid";$("chips").hidden=S.mode==="paid";
  $("horse").classList.toggle("on",S.mode==="hire");
  if(T&&S.mode!=="vac"){const rem=Math.max(0,Math.ceil(T.nextAt-T.cnt));$("remain").firstChild.nodeValue=rem;$("remainLbl").textContent=T.cnt<T.cfg.baseDist?"기본거리 남음 (m)":"다음 요금까지 (m)"}
  else{$("remain").firstChild.nodeValue=S.set.baseDist;$("remainLbl").textContent="기본거리 (m)"}
  let sub="";
  if(S.mode==="paid")sub=`미터 ${won(tt.fare)}`+(tt.call?` + 호출 ${won(tt.call)}`:"")+(tt.extra?` + 추가 ${won(tt.extra)}`:"")+(tt.disc?` − 인할 ${won(tt.disc)}`:"")+(T?` · ${km(T.dist)} · ${dur(T.secs)}`:"");
  else if(S.mode==="hire"&&T)sub=`${km(T.dist)} · ${dur(T.secs)}`+(tt.extra?` · 추가 ${won(tt.extra)}`:"")+(tt.disc?` · 인할 −${won(tt.disc)}`:"");
  else sub=`거리 ${S.set.unitDist}m · 시간 ${S.set.unitSec}초당 ${unitAmt(S.set,r)}원`;
  $("sub").textContent=sub;
  let c="";
  if(S.night)c+=`<span class="chip n">심야 할증</span>`;
  if(S.out)c+=`<span class="chip o">시외 할증</span>`;
  if(S.disc)c+=`<span class="chip d">인할 ${S.set.discRate}%</span>`;
  if(S.extras.length)c+=`<span class="chip x">추가 ${S.extras.length}건</span>`;
  if(S.practice)c+=`<span class="chip p">연습</span>`;
  $("chips").innerHTML=c;
  const pb=$("payBtns");pb.hidden=S.mode!=="paid";
  if(S.mode==="paid")pb.querySelectorAll("button").forEach(b=>b.classList.toggle("on",T&&T.pay===b.dataset.pay));
  const sv=S.stats,items=[`1.총주행 ${(sv.total/1000).toFixed(1)}㎞`,`2.영업 ${(sv.biz/1000).toFixed(1)}㎞`,`3.영업 ${sv.count}회`,`4.빈차 ${(sv.empty/1000).toFixed(1)}㎞`,`5.합산 ${sv.sum.toLocaleString("ko-KR")}원`];
  $("stats").innerHTML=items.map((x,i)=>`<span class="${i===S.statSel?"sel":""}">${x}</span>`).join("");
  $("serial").textContent="번호 "+S.serial;
  document.querySelectorAll(".fk").forEach(b=>{const k=b.dataset.k;b.classList.toggle("on",
    k==="vac"?S.mode==="vac":k==="hire"?S.mode==="hire":k==="night"?S.night&&!S.out:k==="combo"?S.night&&S.out:k==="pay"?S.mode==="paid":false)});
  document.querySelector('[data-k=out]').classList.toggle("on",S.out);
  document.querySelector('[data-k=callk]').classList.toggle("on",S.call>0);
  document.querySelector('[data-k=disc]').classList.toggle("on",S.disc);
  document.querySelector('[data-k=prac]').classList.toggle("on",S.practice);
  const inp=$("input");inp.hidden=!input;if(input)inp.innerHTML=`<small>입력</small>${Number(input).toLocaleString("ko-KR")}`;
  $("practice").hidden=!S.practice;$("pSpdTxt").textContent="시속 "+$("pSpd").value+"㎞";
}

/* ───────── 매 초 ───────── */
function autoNight(){
  if(!S.set.nightAuto)return;
  const w=nightWindowRate(new Date(),S.trip?S.trip.cfg:S.set)!=null;
  if(w!==S.lastWin){S.lastWin=w;if(S.night!==w){S.night=w;dirty=true;if(w&&S.mode==="hire")say("심야 할증이 적용됩니다")}}
}
function tick(){
  const now=Date.now();
  drainNative();autoNight();
  if(S.practice){const v=+$("pSpd").value,dt=Math.min(Math.max((now-S.lastT)/1000,0),60);curSpeed=v;advance(now,v/3.6*dt,v)}
  else if(!lastFixT||now-lastFixT>3000){if(now-lastFixT>5000)curSpeed=0;advance(now,0,0)}
  render();save(false);
}

/* ───────── 버튼 동작 ───────── */
function finishTrip(){
  const T=S.trip;T.end=Date.now();const tt=totals();
  const rec={id:T.start,start:T.start,end:T.end,dist:T.dist,secs:T.secs,fare:tt.fare,call:tt.call,extra:tt.extra,extras:S.extras.slice(),disc:tt.disc,total:tt.total,
    rate:T.maxRate,night:S.night,out:S.out,pay:"",cfg:{base:T.cfg.base}};
  S.hist.unshift(rec);if(S.hist.length>2000)S.hist.length=2000;
  T.histId=rec.id;S.stats.count++;S.stats.sum+=tt.total;S.mode="paid";
  say(`요금은 ${tt.total}원입니다. 감사합니다`);
}
function undoFinish(){
  const T=S.trip;const i=S.hist.findIndex(h=>h.id===T.histId);
  if(i>=0){S.stats.count--;S.stats.sum-=S.hist[i].total;S.hist.splice(i,1)}
  T.histId=null;T.end=null;S.mode="hire";S.lastT=Date.now();
}
function resetVac(){S.mode="vac";S.trip=null;S.call=0;S.extras=[];S.disc=false;S.out=false;if(S.set.nightAuto)S.night=nightWindowRate(new Date())!=null;S.lastT=Date.now()}
const ACT={
  vac(){if(S.mode==="paid"){resetVac();toast("빈차")}else if(S.mode==="hire")toast("먼저 지불을 눌러 주세요 · 길게 누르면 운행 취소");else toast("빈차 상태예요")},
  vacLong(){if(S.mode==="hire")ask("운행 취소","지금 운행을 기록 없이 취소할까요?",()=>{resetVac();toast("운행을 취소했어요")})},
  hire(){if(S.mode==="vac"){startTrip();say("안전벨트를 착용해 주세요");toast("주행 시작")}else if(S.mode==="paid"){undoFinish();toast("주행으로 돌아왔어요")}},
  night(){S.night=!S.night;if(S.night&&S.out){}toast(S.night?`심야 할증 ${curRate()}%`:"심야 할증 해제")},
  combo(){const on=!(S.night&&S.out);S.night=on;S.out=on;toast(on?`복합 할증 ${curRate()}%`:"복합 할증 해제")},
  pay(){if(S.mode==="hire")finishTrip();else if(S.mode==="paid")toast("빈차를 누르면 다음 손님을 받아요");else toast("주행 중이 아니에요")},
  mode(){S.statSel=(S.statSel+1)%5},
  modeLong(){ask("누적 기록 초기화","총주행·영업·빈차 거리, 영업 횟수, 합산 요금을 0으로 돌릴까요? (운행 기록 목록은 남아요)",()=>{S.stats={total:0,biz:0,empty:0,count:0,sum:0};toast("초기화했어요")})},
  cargo(){if(S.mode==="paid")return toast("주행으로 돌아가서 추가해 주세요");const n=input?+input:+S.set.cargoFee;if(!n)return toast("금액을 입력해 주세요");S.extras.push(n);input="";toast(`추가 요금 ${won(n)}`)},
  out(){S.out=!S.out;toast(S.out?`시외 할증 ${S.set.out}%`:"시외 할증 해제")},
  callk(){if(S.mode==="paid")return toast("주행으로 돌아가서 바꿔 주세요");if(input){S.call=+input;input=""}else S.call=S.call?0:+S.set.callFee;toast(S.call?`호출 요금 ${won(S.call)}`:"호출 요금 해제")},
  disc(){if(S.mode==="paid")return toast("주행으로 돌아가서 바꿔 주세요");if(input){const n=Math.min(100,+input);S.set.discRate=n;S.disc=n>0;input=""}else S.disc=!S.disc;toast(S.disc?`인할 ${S.set.discRate}%`:"인할 해제")},
  print(){const rec=S.mode==="paid"&&S.trip?S.hist.find(h=>h.id===S.trip.histId):S.mode==="hire"?null:S.hist[0];
    if(S.mode==="hire"){showReceipt(liveRec());return}if(!rec)return toast("출력할 영수증이 없어요");showReceipt(rec)},
  hist(){showHist()},
  prac(){S.practice=!S.practice;if(!S.practice){$("pSpd").value=0;curSpeed=0}lastFix=null;S.lastT=Date.now();toast(S.practice?"연습 주행: 막대로 속도를 정해요":"연습 주행 끝")},
  set(){showSet()},
  cancel(){if(input){input="";return}if(S.mode==="paid")return toast("주행으로 돌아가서 취소해 주세요");

};

function bindPress(el,short,long){
  let tm=null,fired=false;

    if(long)tm=setTimeout(()=>{fired=true;beep(1400);long();render();save(true)},800)});
  const up=()=>{if(tm){clearTimeout(tm);tm=null}};
  el.addEventListener("pointerup",e=>{up();if(!fired){beep();short();render();save(true)}});
  el.addEventListener("pointerleave",up);el.addEventListener("pointercancel",()=>{up();fired=true});
  el.addEventListener("contextmenu",e=>e.preventDefault());
}

function showReceipt(r){
  const st=S.set,L=[];
  const ln=(a,b,cls)=>`<div class="ln ${cls||""}"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
  let h=`<h3>택시 영수증</h3>`;
  if(st.shop)h+=`<div class="c">${esc(st.shop)}</div>`;
  h+=`<hr>`;
  const rows=[];
  if(st.carNo)rows.push(["차량번호",st.carNo]);if(st.bizNo)rows.push(["사업자번호",st.bizNo]);if(st.driver)rows.push(["운전자",st.driver]);if(st.phone)rows.push(["연락처",st.phone]);
  rows.push(["승차",fmtTime(r.start)],["하차",r.live?"주행 중":fmtTime(r.end)],["주행거리",km(r.dist)],["주행시간",dur(r.secs)]);
  if(r.rate)rows.push(["할증",r.rate+"%"]);
  const rows2=[["미터 요금",won(r.fare)]];
  if(r.call)rows2.push(["호출 요금",won(r.call)]);

  if(r.pay)h+=ln("결제",r.pay);

  $("receipt").innerHTML=h;
  rcText=["[택시 영수증]",st.shop].filter(Boolean).concat(rows.map(x=>x[0]+": "+x[1]),["-----"],rows2.map(x=>x[0]+": "+x[1]),["-----","합계: "+won(r.total)],r.pay?["결제: "+r.pay]:[]).join("\n");

  ["sec","요금 기준"],
  ["preset"],
  ["n","base","기본요금","원"],["n","baseDist","기본거리","m"],
  ["n","unitFare","거리·시간 요금","원"],["n","unitDist","거리 요금 단위","m"],
  ["n","unitSec","시간 요금 단위","초"],["n","thr","시간 요금 적용 속도 (이하)","㎞"],

let draft=null;
function showSet(){draft=JSON.parse(JSON.stringify(S.set));buildSet();open("setSheet")}
function buildSet(){
  let h="";
  for(const f of FIELDS){
    if(f[0]==="sec")h+=`<div class="sec">${f[1]}</div>`;
    else if(f[0]==="help")h+=`<p class="help">${f[1]}</p>`;
    else if(f[0]==="preset")h+=`<div class="fld" style="grid-column:1/3"><span>지역 요금표 불러오기</span><div class="seg">${Object.entries(PRESETS).map(([k,p])=>`<button type="button" data-pre="${k}" class="${draft.preset===k?"on":""}">${p.label}</button>`).join("")}<button type="button" data-pre="custom" class="${draft.preset==="custom"?"on":""}">직접 입력</button></div></div>`;
    else if(f[0]==="n")h+=`<label class="fld"><span>${f[2]}</span><input type="number" inputmode="decimal" data-f="${f[1]}" value="${esc(draft[f[1]])}"><span class="u">${f[3]}</span></label>`;
    else if(f[0]==="t")h+=`<label class="fld"><span>${f[2]}</span><input type="text" data-f="${f[1]}" value="${esc(draft[f[1]])}"></label>`;
    else if(f[0]==="c")h+=`<label class="fld"><span>${f[2]}</span><input type="checkbox" data-f="${f[1]}" ${draft[f[1]]?"checked":""}></label>`;
    else if(f[0]==="night")h+=`<div style="grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6) calc(var(--u)*4)">${draft.night.map((w,i)=>`<div class="nightRow">심야 ${i+1} <input type="number" data-nw="${i},0" value="${esc(w[0])}">시~<input type="number" data-nw="${i},1" value="${esc(w[1])}">시 <input type="number" data-nw="${i},2" value="${esc(w[2])}">%</div>`).join("")}</div>`;
  }
  const form=$("setForm");form.innerHTML=h;
  form.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{readSet();const k=b.dataset.pre;draft.preset=k;if(PRESETS[k]){const p=JSON.parse(JSON.stringify(PRESETS[k]));delete p.label;Object.assign(draft,p)}buildSet()});
  form.querySelectorAll("input").forEach(i=>i.addEventListener("change",()=>{if(i.dataset.f&&i.type==="number"||i.dataset.nw){draft.preset="custom";form.querySelectorAll("[data-pre]").forEach(b=>b.classList.toggle("on",b.dataset.pre==="custom"))}}));

}

/* ───────── 달리는 사람 (움짤 10장면을 그대로 옮겨 파란 선으로, 속도에 맞춰 재생) ───────── */
(function(){
  const cv=$("horse"),g=cv.getContext("2d"),off=document.createElement("canvas"),o=off.getContext("2d");
  let ph=0,last=performance.now(),amp=0,W=0,H=0;
  const col="#6cbcff";
  // 장면마다: 머리, 앞어깨, 앞팔꿈치, 앞손, 뒤어깨, 뒤팔꿈치, 뒤손, 엉덩이, 다리1(무릎·발목·발끝), 다리2(무릎·발목·발끝)  (원본 300×391 좌표)
  const K=[
   [75,75, 100,110,40,130,5,155, 195,85,240,85,250,115, 160,205, 95,245,40,300,5,300, 225,265,275,310,280,350],
   [95,60, 115,110,60,125,15,130, 205,85,245,95,260,130, 180,205, 110,250,55,310,20,315, 240,265,285,300,290,335],
   [105,45, 110,95,45,105,15,130, 210,80,250,110,250,155, 175,200, 125,250,85,320,50,345, 180,270,255,265,270,300],
   [125,30, 100,95,65,110,55,140, 215,80,240,120,220,170, 170,200, 160,270,130,340,115,380, 175,265,240,300,245,340],
   [110,35, 110,100,90,140,95,160, 195,85,200,140,165,175, 165,210, 190,290,210,355,195,380, 105,255,160,300,185,330],
   [90,55, 105,115,90,150,95,165, 195,90,195,140,170,175, 180,210, 235,270,285,320,290,355, 90,255,80,330,60,350],
   [80,60, 100,110,85,140,80,155, 180,90,195,140,170,165, 165,210, 220,265,285,300,295,325, 85,250,40,300,5,310],
   [95,45, 110,105,100,145,105,165, 190,85,200,140,180,170, 180,210, 235,275,265,268,275,305, 100,255,55,320,25,340],
   [105,40, 110,105,85,140,75,160, 200,90,205,140,180,165, 165,210, 175,270,225,300,230,335, 140,280,140,345,115,375],
   [85,50, 105,110,65,140,50,165, 200,95,225,130,230,155, 180,210, 100,260,85,330,65,350, 220,290,245,345,230,370]
  ];
  const STAND=[150,55, 135,110,125,165,125,215, 180,108,190,165,192,215, 160,215, 150,290,150,360,128,368, 172,290,172,360,150,368];
  function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width)return;W=r.width;H=r.height;
    cv.width=off.width=Math.round(W*d);cv.height=off.height=Math.round(H*d)}
  addEventListener("resize",()=>setTimeout(size,250));
  function pose(t,a){const n=K.length,f=t*n,i=Math.floor(f)%n,j=(i+1)%n,u=f-Math.floor(f);
    return K[i].map((v,k)=>{const run=v+(K[j][k]-v)*u;return STAND[k]+(run-STAND[k])*a})}
  function shapes(c,P,grow,mode){   // mode 0: 굵게 칠하기, 1: 안쪽 지우기
    const pt=k=>[P[k],P[k+1]];
    const head=pt(0),sf=pt(2),ef=pt(4),wf=pt(6),sb=pt(8),eb=pt(10),wb=pt(12),hip=pt(14);
    const mid=[(sf[0]+sb[0])/2,(sf[1]+sb[1])/2],neck=[head[0]+(mid[0]-head[0])*.55,head[1]+(mid[1]-head[1])*.55];
    const L=(pts,w)=>{c.lineWidth=w+grow;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))c.lineTo(q[0],q[1]);c.stroke()};
    const C=(q,r)=>{c.beginPath();c.arc(q[0],q[1],r+grow/2,0,7);c.fill()};
    // 다리 (바지·구두)
    for(const b of [16,22]){const kn=pt(b),an=pt(b+2),to=pt(b+4);L([hip,kn],36);L([kn,an],27);L([an,to],15)}
    // 팔
    L([sb,eb],26);L([eb,wb],21);C(wb,9);L([sf,ef],26);L([ef,wf],21);C(wf,9);
    // 윗도리
    const dx=hip[0]-mid[0],dy=hip[1]-mid[1];
    const hemF=[hip[0]-46+dx*.08,hip[1]-6],hemB=[hip[0]+40+dx*.1,hip[1]+2];
    c.beginPath();c.moveTo(sf[0]-6,sf[1]-4);c.lineTo(neck[0],neck[1]-4);c.lineTo(sb[0]+6,sb[1]-6);c.lineTo(hemB[0],hemB[1]);c.lineTo(hemF[0],hemF[1]);c.closePath();
    c.lineWidth=grow||0.01;c.fill();if(grow)c.stroke();
    L([neck,head],18);C(head,24);
    return{head,neck,hemF,hemB,sf,sb};
  }
  function frame(now){
    if(!W)size();
    const dt=Math.min(.1,(now-last)/1000);last=now;
    const v=S.mode==="hire"?(S.practice?+$("pSpd").value:curSpeed):0;
    const rate=v<1?0:Math.min(2.2,.35+v/38);                    // 초당 재생 횟수 (원본은 0.5초에 한 번)
    const target=v<1?0:Math.min(1,.45+v/60);                    // 느리면 동작이 작고, 빠르면 원본 그대로 크게
    amp+=(target-amp)*Math.min(1,dt*4);
    ph=(ph+rate*dt)%1;
    if(W){
      const d=devicePixelRatio||1,sc=Math.min(W/310,H/392)*d,ox=(W*d-300*sc)/2,oy=(H*d-392*sc)/2+4*sc;
      const P=pose(ph,amp);
      o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,off.width,off.height);
      o.setTransform(sc,0,0,sc,ox,oy);o.lineCap="round";o.lineJoin="round";
      const T=7;                                                   // 선 굵기 (원본 좌표)
      o.globalCompositeOperation="source-over";o.fillStyle=o.strokeStyle=col;shapes(o,P,T*2,0);
      o.globalCompositeOperation="destination-out";o.fillStyle=o.strokeStyle="#000";const J=shapes(o,P,0,1);
      // 안쪽 선: 머리, 윗도리 아랫단, 깃
      o.globalCompositeOperation="source-over";o.strokeStyle=col;o.lineWidth=T;
      o.beginPath();o.arc(J.head[0],J.head[1],24,0,7);o.stroke();
      o.beginPath();o.moveTo(J.hemF[0],J.hemF[1]);o.lineTo(J.hemB[0],J.hemB[1]);o.stroke();
      o.lineWidth=T*.8;o.beginPath();o.moveTo(J.neck[0]-4,J.neck[1]+2);o.lineTo((J.neck[0]+J.hemF[0])/2+14,(J.neck[1]+J.hemF[1])/2+6);o.stroke();
      o.lineWidth=T*1.6;o.beginPath();o.arc(J.head[0],J.head[1],24,Math.PI*1.0,Math.PI*1.9);o.stroke();   // 머리카락
      g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
      g.shadowColor=col;g.shadowBlur=5*d;g.drawImage(off,0,0);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
S.lastT=Date.now();lastFixT=0;
startGps();render();setInterval(tick,500);wake();
})();
